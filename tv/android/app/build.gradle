plugins {
    id 'com.android.application'
}

android {
    namespace 'info.stamko.wmp'
    compileSdk 35

    defaultConfig {
        applicationId 'info.stamko.wmp'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded as is.
            // For the Play Store, replace this with your own upload key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
